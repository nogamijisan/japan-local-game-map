name: Sync Notion games and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "games.json"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/sync-notion.yml"
  schedule:
    # 毎日03:17（日本時間）/ UTC 18:17
    - cron: "17 18 * * *"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test exporter
        run: python -m unittest discover -s tests -v

      - name: Fetch Notion and generate games.json
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: "41add27a-37b4-812d-a3e3-000bdb2e4ba6"
        run: python scripts/export_notion.py --output games.json

      - name: Commit updated JSON
        run: |
          if ! git diff --quiet -- games.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add games.json
            git commit -m "chore: sync games.json from Notion"
            git push origin HEAD:main
          else
            echo "games.json is already up to date"
          fi

      - name: Prepare published files
        run: |
          mkdir -p _site/assets
          cp index.html games.json _site/
          cp assets/japan-prefectures.svg _site/assets/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
